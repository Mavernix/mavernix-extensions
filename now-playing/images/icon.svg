<!-- The Now Playing extension's picture in the App Store and the settings
     window: a level meter of four bars, in white on a glossy purple tile,
     like the AirPods one. Drawn for Mavernix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="base" x1="0" y1="32" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c58cff"/>
      <stop offset="1" stop-color="#6a2fd0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="32" x2="0" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <g id="glyph">
      <rect x="140" y="236" width="40" height="124" rx="12"/>
      <rect x="204" y="152" width="40" height="208" rx="12"/>
      <rect x="268" y="196" width="40" height="164" rx="12"/>
      <rect x="332" y="270" width="40" height="90" rx="12"/>
    </g>
  </defs>

  <rect x="32" y="44" width="448" height="448" rx="92" fill="#000" opacity="0.18"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="url(#base)"/>
  <use href="#glyph" transform="translate(0 8)" fill="#000" opacity="0.25"/>
  <use href="#glyph" fill="#fff"/>
  <path d="M32 124 A92 92 0 0 1 124 32 H388 A92 92 0 0 1 480 124 V232 Q256 300 32 232 Z" fill="url(#gloss)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="90.5" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
</svg>
