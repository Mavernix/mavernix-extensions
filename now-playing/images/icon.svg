<!-- The Now Playing extension's picture in the App Store and the settings
     window: a pair of quavers before a play symbol, in white on a glossy
     red tile. Drawn for Mavernix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="base" x1="0" y1="32" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#d0193a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="32" x2="0" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <g id="glyph">
      <!-- The two stems and the beam as one shape, so they join cleanly;
           each stem stands on its head's right edge. -->
      <g transform="translate(0.5 0)" stroke="none">
        <path d="M5.4 9.5 L17.2 7 L17.2 20.6 L15.4 20.6 L15.4 10.38 L7.2 12.12 L7.2 23.1 L5.4 23.1 Z"/>
        <ellipse cx="3.9" cy="23.3" rx="3.4" ry="2.5" transform="rotate(-20 3.9 23.3)"/>
        <ellipse cx="13.9" cy="20.8" rx="3.4" ry="2.5" transform="rotate(-20 13.9 20.8)"/>
      </g>
      <path d="M20.5 11 L31 18 L20.5 25 Z" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="32" y="44" width="448" height="448" rx="92" fill="#000" opacity="0.18"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="url(#base)"/>
  <use href="#glyph" transform="translate(118 126) scale(8.4)" fill="#000" stroke="#000" opacity="0.25"/>
  <use href="#glyph" transform="translate(118 118) scale(8.4)" fill="#fff" stroke="#fff"/>
  <path d="M32 124 A92 92 0 0 1 124 32 H388 A92 92 0 0 1 480 124 V232 Q256 300 32 232 Z" fill="url(#gloss)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="90.5" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
</svg>
