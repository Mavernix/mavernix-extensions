<!-- The AirPods extension's picture in the App Store and the settings
     window: the panel's pair of earbuds, in white on a glossy blue tile.
     Drawn for Mavernix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="base" x1="0" y1="32" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cc4ff"/>
      <stop offset="1" stop-color="#1764d4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="32" x2="0" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="cuts" maskUnits="userSpaceOnUse" x="-40" y="-40" width="120" height="120">
      <rect x="-40" y="-40" width="120" height="120" fill="#fff"/>
      <ellipse cx="6" cy="6.6" rx="6" ry="6.8" fill="#000"/>
      <rect x="12.2" y="4.9" width="5.4" height="3.2" rx="1.6" fill="#000"/>
    </mask>
    <g id="earbud">
      <g mask="url(#cuts)">
        <ellipse cx="13.4" cy="6.4" rx="7.6" ry="6.4" stroke="none"/>
        <path d="M11.6 10.8 L4.4 18.4" fill="none" stroke-width="4" stroke-linecap="round"/>
      </g>
      <ellipse cx="6" cy="6.6" rx="3.7" ry="4.4" stroke="none"/>
    </g>
    <g id="glyph">
      <use href="#earbud"/>
      <use href="#earbud" transform="translate(32 13.2) scale(-1 1)"/>
    </g>
  </defs>

  <rect x="32" y="44" width="448" height="448" rx="92" fill="#000" opacity="0.18"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="url(#base)"/>
  <use href="#glyph" transform="translate(126 140) scale(8.2)" fill="#000" stroke="#000" opacity="0.25"/>
  <use href="#glyph" transform="translate(126 132) scale(8.2)" fill="#fff" stroke="#fff"/>
  <path d="M32 124 A92 92 0 0 1 124 32 H388 A92 92 0 0 1 480 124 V232 Q256 300 32 232 Z" fill="url(#gloss)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="90.5" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
</svg>
